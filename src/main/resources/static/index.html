<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Central de Chamados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <main class="app-conteudo">
        <div class="pagina-cabecalho">
            <div>
                <h1 class="pagina-titulo">Dashboard</h1>
                <p class="pagina-subtitulo">Visão geral dos chamados.</p>
            </div>
        </div>

        <div class="cartao">
            <div class="vazio">
                <div class="vazio-icone"><i class="bi bi-bar-chart-line"></i></div>
                <div class="vazio-titulo">Indicadores em breve</div>
                <p class="mb-0">A contagem de chamados por status e os últimos chamados aparecerão aqui.</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
</body>
</html>
