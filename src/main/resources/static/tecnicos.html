<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnicos · Central de Chamados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <main class="app-conteudo">
        <div class="pagina-cabecalho">
            <div>
                <h1 class="pagina-titulo">Técnicos</h1>
                <p class="pagina-subtitulo">Equipe responsável pelo atendimento dos chamados.</p>
            </div>
            <button class="btn btn-primary" type="button" id="botao-novo">
                <i class="bi bi-plus-lg"></i>Novo técnico
            </button>
        </div>

        <div id="erro-pagina"></div>

        <div class="cartao">
            <div class="barra-ferramentas">
                <div class="filtros">
                    <div class="busca">
                        <i class="bi bi-search"></i>
                        <input type="search" class="form-control" id="busca" placeholder="Buscar técnico" aria-label="Buscar técnicos por nome ou e-mail">
                    </div>
                    <select class="form-select" id="filtro-perfil" aria-label="Filtrar por perfil">
                        <option value="">Todos os perfis</option>
                        <option value="ADMIN">Administrador</option>
                        <option value="TECNICO">Técnico</option>
                    </select>
                </div>
                <span class="contador" id="contador"></span>
            </div>
            <div id="lista">
                <div class="carregando"><span class="spinner-border spinner-border-sm"></span>Carregando técnicos...</div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modal-tecnico" tabindex="-1" aria-labelledby="modal-titulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="formulario" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-titulo">Novo técnico</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div id="erro-formulario"></div>
                    <div class="mb-3">
                        <label class="form-label" for="nome">Nome <span class="obrigatorio">*</span></label>
                        <input type="text" class="form-control" id="nome" maxlength="100" required placeholder="Ex.: Carlos Lima">
                        <div class="invalid-feedback">Informe o nome do técnico.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">E-mail <span class="obrigatorio">*</span></label>
                        <input type="email" class="form-control" id="email" maxlength="120" required placeholder="Ex.: carlos@empresa.com">
                        <div class="invalid-feedback">Informe um e-mail válido.</div>
                    </div>
                    <div class="mb-1">
                        <label class="form-label" for="perfil">Perfil <span class="obrigatorio">*</span></label>
                        <select class="form-select" id="perfil" required>
                            <option value="TECNICO">Técnico</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                        <div class="form-text">Administradores atribuem chamados e mantêm os cadastros.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="botao-salvar">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/tecnicos.js"></script>
</body>
</html>
