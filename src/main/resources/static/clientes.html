<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes · Central de Chamados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <main class="app-conteudo">
        <div class="pagina-cabecalho">
            <div>
                <h1 class="pagina-titulo">Clientes</h1>
                <p class="pagina-subtitulo">Pessoas e setores que abrem chamados.</p>
            </div>
            <button class="btn btn-primary" type="button" id="botao-novo">
                <i class="bi bi-plus-lg"></i>Novo cliente
            </button>
        </div>

        <div id="erro-pagina"></div>

        <div class="cartao">
            <div class="barra-ferramentas">
                <div class="busca">
                    <i class="bi bi-search"></i>
                    <input type="search" class="form-control" id="busca" placeholder="Buscar cliente" aria-label="Buscar clientes por nome, e-mail ou telefone">
                </div>
                <span class="contador" id="contador"></span>
            </div>
            <div id="lista">
                <div class="carregando"><span class="spinner-border spinner-border-sm"></span>Carregando clientes...</div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/formulario-cliente.js"></script>
    <script src="/js/clientes.js"></script>
</body>
</html>
